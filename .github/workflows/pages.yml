# Builds the static store and publishes it to GitHub Pages.
# Enables Pages itself on first run (actions/configure-pages enablement). If that is refused, do it by hand:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repo>/ (custom domain: Settings → Pages → Custom domain).
name: store-pages

on:
  push:
    branches: [main, shadowlamp-engine]
    paths: ["store/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true     # switches Pages on for the repo the first time
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
